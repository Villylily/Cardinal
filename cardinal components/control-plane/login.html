<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Cardinal</title>
    <link rel="stylesheet" href="/control/style.css">
</head>
<body>
    <main class="login-card">
        <a class="brand login-brand" href="/control/login">
            <svg class="brand-icon" viewBox="0 0 120 120" aria-hidden="true">
                <polygon points="60,5 115,30 115,90 60,115 5,90 5,30" fill="rgba(48,54,61,.1)" stroke="#ff4757" stroke-width="3" stroke-linejoin="round"/>
                <path d="M60 15 90 30v30L60 75 30 60V30zM60 45l30 15v30l-30 15-30-15V60z" fill="none" stroke="#ff4757" stroke-width="1" opacity=".5"/>
                <line x1="45" y1="45" x2="75" y2="75" stroke="#ffb7c5" stroke-width="2.5" stroke-dasharray="5 5"/>
                <polyline points="20,30 5,30 5,45" fill="none" stroke="#f2edf1" stroke-width="2"/>
                <polyline points="100,90 115,90 115,75" fill="none" stroke="#f2edf1" stroke-width="2"/>
            </svg>
            <strong>Cardinal</strong>
        </a>
        <h1>Log in</h1>
        <p class="muted">Use the Cardinal login you set up.</p>
        <form id="loginForm">
            <label>Username<input name="username" autocomplete="username" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Log in</button>
            <p id="loginError" class="error" role="status"></p>
        </form>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button[type="submit"]');
            const errorElement = document.getElementById('loginError');
            button.disabled = true;
            errorElement.textContent = '';
            const form = new FormData(event.currentTarget);
            try {
                const response = await fetch('/control/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: form.get('username'), password: form.get('password') })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    errorElement.textContent = result.message || 'That login didn’t work. Try again.';
                    return;
                }
                location.href = '/control';
            } catch (error) {
                errorElement.textContent = `Couldn’t reach Cardinal: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
